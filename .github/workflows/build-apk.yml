name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

# Jika ada push beruntun, batalkan build lama agar tidak menumpuk.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

# Mengizinkan workflow menyimpan tag versi setelah APK berhasil dibuat.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Pasang keystore tetap
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Memakai keystore dari GitHub Secret KEYSTORE_BASE64"
          else
            cp keystore/debug.keystore ~/.android/debug.keystore
            echo "Memakai keystore dari folder keystore/"
          fi
          if ! keytool -list -v -keystore ~/.android/debug.keystore -storepass android > /tmp/ks.txt 2>&1; then
            cat /tmp/ks.txt
            echo "::error::Keystore RUSAK / tidak terbaca (biasanya karena file biner ditempel sebagai teks). Unggah ulang lewat Add file > Upload files. Tanpa keystore tetap, APK baru tidak akan bisa menimpa aplikasi lama."
            exit 1
          fi
          grep -E "Alias|Owner|SHA256" /tmp/ks.txt

      - name: Buat kerangka proyek Android
        run: flutter create --platforms=android --project-name kedai_pos --org com.kedai build_app

      - name: Ubah nama aplikasi
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Pawoen Langgananku"/' build_app/android/app/src/main/AndroidManifest.xml

      - name: Izin Bluetooth untuk printer kasir
        run: |
          M=build_app/android/app/src/main/AndroidManifest.xml
          for P in BLUETOOTH BLUETOOTH_ADMIN BLUETOOTH_CONNECT BLUETOOTH_SCAN; do
            sed -i "/<application/i\\    <uses-permission android:name=\"android.permission.$P\" />" "$M"
          done
          grep -n "uses-permission" "$M"

      - name: Salin kode aplikasi
        run: |
          rm -rf build_app/lib build_app/test
          cp -r lib build_app/lib
          cp -r assets build_app/assets
          cp pubspec.yaml build_app/pubspec.yaml

      - name: Ambil paket
        working-directory: build_app
        run: flutter pub get

      - name: Buat ikon aplikasi
        working-directory: build_app
        run: dart run flutter_launcher_icons

      # Pola versi: 1.1.1 ... 1.1.11, 1.2.1 ... 1.11.11, 2.1.1, dan seterusnya.
      - name: Tentukan versi otomatis
        id: version
        shell: bash
        run: |
          latest_tag=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)

          if [ -z "$latest_tag" ]; then
            major=1
            minor=1
            patch=0
          else
            if [[ ! "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::Format tag versi tidak valid: $latest_tag"
              exit 1
            fi
            major=${BASH_REMATCH[1]}
            minor=${BASH_REMATCH[2]}
            patch=${BASH_REMATCH[3]}
          fi

          if (( patch < 11 )); then
            patch=$((patch + 1))
          else
            patch=1
            if (( minor < 11 )); then
              minor=$((minor + 1))
            else
              minor=1
              major=$((major + 1))
            fi
          fi

          version="${major}.${minor}.${patch}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Versi APK berikutnya: $version"

      - name: Build APK (release)
        working-directory: build_app
        run: >
          flutter build apk --release
          --build-number=$(( $(date +%s) / 60 ))
          --build-name=${{ steps.version.outputs.version }}

      - name: Ganti nama APK
        run: mv build_app/build/app/outputs/flutter-apk/app-release.apk build_app/build/app/outputs/flutter-apk/pawon.apk

      - name: Cek tanda tangan APK
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs build_app/build/app/outputs/flutter-apk/pawon.apk | grep "SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: kedai-pos-apk
          path: build_app/build/app/outputs/flutter-apk/pawon.apk

      - name: Simpan tag versi
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$APP_VERSION" "$GITHUB_SHA"
          git push origin "v$APP_VERSION"
